name: Privacy gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check shareable content
        run: python3 scripts/agent-privacy-check.py guard --root . --tracked --history
